<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PrepPilot /feature workflow">

  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L11,5 z" fill="#E8500A"/>
    </marker>
    <marker id="arrowSmall" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#E8500A"/>
    </marker>
    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8500A"/>
      <stop offset="100%" stop-color="#FF6B2B"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="0" y="0" width="6" height="100" fill="url(#titleAccent)"/>
  <text x="60" y="56" font-size="34" font-weight="800" fill="#0A0A0A" letter-spacing="-0.5">PrepPilot — <tspan class="mono">/feature</tspan> Workflow</text>
  <text x="60" y="82" font-size="14" font-weight="500" fill="#6B6B6B">Automated feature engineering pipeline</text>
  <text x="1860" y="68" font-size="12" fill="#9B9B9B" text-anchor="end">2026-05-19 · Sprint 5.7</text>

  <line x1="40" y1="105" x2="1880" y2="105" stroke="#E5E4E1" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       VERTICAL WORKFLOW · main spine at x=960                                        -->

  <!-- ● START -->
  <circle cx="960" cy="155" r="26" fill="#E8500A" filter="url(#shadow)"/>
  <text x="960" y="161" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">START</text>

  <line x1="960" y1="182" x2="960" y2="208" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 1: POST /feature -->
  <rect x="770" y="212" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="240" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">POST <tspan class="mono">/feature</tspan></text>
  <text x="960" y="262" font-size="11" fill="#6B6B6B" text-anchor="middle">HTTP endpoint · load dataset from DB</text>

  <!-- Data flow chip -->
  <rect x="1180" y="234" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="250" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">df: DataFrame</text>

  <line x1="960" y1="280" x2="960" y2="304" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Analyze -->
  <rect x="770" y="308" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="336" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Analyze · AI Suggest</text>
  <text x="960" y="358" font-size="11" fill="#6B6B6B" text-anchor="middle" class="mono">feature_agent.analyze(df)</text>

  <rect x="1180" y="330" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="346" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">FeatureAnalysis</text>

  <line x1="960" y1="376" x2="960" y2="400" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Setup Panel -->
  <rect x="770" y="404" width="380" height="68" rx="12" fill="#FFF3EE" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="432" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Setup Panel</text>
  <text x="960" y="454" font-size="11" fill="#6B6B6B" text-anchor="middle">user reviews · confirms or overrides</text>

  <rect x="1180" y="426" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="442" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">FeatureConfig</text>

  <line x1="960" y1="472" x2="960" y2="496" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: PIPELINE (sub-process, taller) -->
  <rect x="500" y="500" width="920" height="200" rx="14" fill="#FFFFFF" stroke="#E8500A" stroke-width="3" filter="url(#shadow)"/>
  <rect x="500" y="500" width="920" height="40" rx="14" fill="#E8500A"/>
  <text x="960" y="528" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Pipeline · <tspan class="mono">feature_agent.run()</tspan></text>

  <!-- 6 sub-step mini-boxes in a row inside the pipeline box -->
  <g transform="translate(520, 560)">
    <!-- Clean -->
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="65" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">_step_clean</text>
    <text x="65" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">fill nulls · outliers</text>

    <line x1="132" y1="30" x2="142" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Encode -->
    <rect x="146" y="0" width="130" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="211" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">_step_encode</text>
    <text x="211" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">label · target enc</text>

    <line x1="278" y1="30" x2="288" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Scale -->
    <rect x="292" y="0" width="130" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="357" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">_step_scale</text>
    <text x="357" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">standard · minmax</text>

    <line x1="424" y1="30" x2="434" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Select -->
    <rect x="438" y="0" width="130" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="503" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">_step_select</text>
    <text x="503" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">RFE · variance</text>

    <line x1="570" y1="30" x2="580" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Derive -->
    <rect x="584" y="0" width="130" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="649" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">_step_derive</text>
    <text x="649" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">interactions</text>

    <line x1="716" y1="30" x2="726" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Reduce -->
    <rect x="730" y="0" width="130" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="795" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">_step_reduce</text>
    <text x="795" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">PCA</text>
  </g>

  <!-- Pipeline note -->
  <text x="960" y="680" font-size="11" font-style="italic" fill="#9B9B9B" text-anchor="middle">each sub-step captures its <tspan class="mono">fitted_*</tspan> state into <tspan class="mono">_PipelineState</tspan></text>

  <line x1="960" y1="700" x2="960" y2="724" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Persist -->
  <rect x="770" y="728" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="756" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Persist State + Dataset</text>
  <text x="960" y="778" font-size="11" fill="#6B6B6B" text-anchor="middle">JSON to disk · row to MongoDB</text>

  <rect x="1180" y="750" width="190" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1275" y="766" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">pipeline_id · dataset_id</text>

  <line x1="960" y1="796" x2="960" y2="820" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Render -->
  <rect x="770" y="824" width="380" height="68" rx="12" fill="#FFF3EE" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="852" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Render Result Card</text>
  <text x="960" y="874" font-size="11" fill="#6B6B6B" text-anchor="middle" class="mono">FeatureReportCard.tsx</text>

  <line x1="960" y1="892" x2="960" y2="916" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ● END -->
  <circle cx="960" cy="942" r="26" fill="#E8500A" filter="url(#shadow)"/>
  <text x="960" y="948" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">END</text>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       LEFT SIDE · lane labels                                                        -->
  <g transform="translate(60, 200)">
    <!-- HTTP lane -->
    <rect x="0" y="12" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="34" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 1</text>
    <text x="20" y="58" font-size="14" font-weight="800" fill="#0A0A0A">HTTP · API</text>
    <text x="20" y="74" font-size="10" fill="#6B6B6B">Next.js → FastAPI</text>

    <!-- AI lane -->
    <rect x="0" y="108" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="130" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 2</text>
    <text x="20" y="154" font-size="14" font-weight="800" fill="#0A0A0A">AI · LLM</text>
    <text x="20" y="170" font-size="10" fill="#6B6B6B">heuristic + suggest</text>

    <!-- User lane -->
    <rect x="0" y="204" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="226" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 3</text>
    <text x="20" y="250" font-size="14" font-weight="800" fill="#0A0A0A">USER · MODAL</text>
    <text x="20" y="266" font-size="10" fill="#6B6B6B">setup panel</text>

    <!-- Backend lane -->
    <rect x="0" y="300" width="220" height="200" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="322" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 4</text>
    <text x="20" y="346" font-size="14" font-weight="800" fill="#0A0A0A">BACKEND</text>
    <text x="20" y="362" font-size="10" fill="#6B6B6B">pipeline run · 6 steps</text>
    <text x="20" y="390" font-size="10" fill="#9B9B9B" class="mono">feature_agent.run()</text>

    <!-- Storage lane -->
    <rect x="0" y="528" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="550" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 5</text>
    <text x="20" y="574" font-size="14" font-weight="800" fill="#0A0A0A">STORAGE</text>
    <text x="20" y="590" font-size="10" fill="#6B6B6B">JSON + MongoDB</text>

    <!-- Frontend lane -->
    <rect x="0" y="624" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="646" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 6</text>
    <text x="20" y="670" font-size="14" font-weight="800" fill="#0A0A0A">FRONTEND</text>
    <text x="20" y="686" font-size="10" fill="#6B6B6B">render card</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       LEGEND                                                                          -->
  <g transform="translate(60, 1015)">
    <circle cx="14" cy="0" r="10" fill="#E8500A"/>
    <text x="34" y="4" font-size="11" fill="#3A3A3A">Start / End event</text>

    <rect x="170" y="-10" width="22" height="20" rx="5" fill="#FFFFFF" stroke="#E8500A" stroke-width="1.5"/>
    <text x="200" y="4" font-size="11" fill="#3A3A3A">Process step</text>

    <rect x="320" y="-10" width="22" height="20" rx="5" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="350" y="4" font-size="11" fill="#3A3A3A">User-interactive step</text>

    <rect x="500" y="-12" width="32" height="24" rx="6" fill="#FFFFFF" stroke="#E8500A" stroke-width="2.5"/>
    <text x="540" y="4" font-size="11" fill="#3A3A3A">Sub-process (expanded)</text>

    <line x1="710" y1="0" x2="738" y2="0" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="748" y="4" font-size="11" fill="#3A3A3A">Sequence flow</text>

    <rect x="880" y="-10" width="22" height="20" rx="10" fill="#FFF3EE" stroke="#FCE0D2"/>
    <text x="910" y="4" font-size="11" fill="#3A3A3A">Data object / payload</text>

    <text x="1800" y="4" font-size="11" fill="#9B9B9B" text-anchor="end" class="mono">PrepPilot · 2026-05-19</text>
  </g>

</svg>