<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFC000"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8390"/>
    </marker>
    <style>
      .group-bg          { fill: #F2F4F7; stroke: #D6DBE2; stroke-width: 1; }
      .group-bg-orange   { fill: #FFF8E1; stroke: #FFE082; stroke-width: 1; }
      .group-bg-blue     { fill: #EEF4FF; stroke: #D2DEF7; stroke-width: 1; }
      .group-label       { font-size: 13px; font-weight: 800; fill: #5B6470; letter-spacing: 1px; }
      .box               { fill: #FFFFFF; stroke: #C9D0DA; stroke-width: 1.2; rx: 10; ry: 10; }
      .box-app           { fill: #FFFFFF; stroke: #1F2937; stroke-width: 1.6; rx: 12; ry: 12; }
      .box-orange        { fill: #FFFFFF; stroke: #FFC000; stroke-width: 1.6; rx: 12; ry: 12; }
      .title             { font-size: 14px; font-weight: 700; fill: #0A0A0A; }
      .title-lg          { font-size: 16px; font-weight: 800; fill: #0A0A0A; }
      .subtitle          { font-size: 11px; fill: #6B6B6B; }
      .pill-text         { font-size: 11px; fill: #0A0A0A; font-weight: 600; }
      .arrow-line        { stroke: #222;    stroke-width: 1.8; fill: none; }
      .arrow-line-orange { stroke: #FFC000; stroke-width: 2.0; fill: none; }
      .arrow-line-gray   { stroke: #7A8390; stroke-width: 1.6; fill: none; }
      .arrow-label       { font-size: 11px; font-weight: 700; fill: #444; }
      .arrow-label-orange{ font-size: 11px; font-weight: 700; fill: #FFC000; }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="1500" height="820" fill="#FFFFFF"/>

  <!-- =====================================================================
       LEGEND (top right)
       ===================================================================== -->
  <g transform="translate(1100,20)">
    <rect x="0" y="0" width="380" height="60" rx="10" ry="10" fill="#FFFFFF" stroke="#E5E4E1" stroke-width="1.2"/>
    <line x1="14" y1="20" x2="40" y2="20" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
    <text x="48" y="24" class="subtitle">Hot path (chat → train → predict)</text>
    <line x1="14" y1="38" x2="40" y2="38" class="arrow-line" marker-end="url(#arrow)"/>
    <text x="48" y="42" class="subtitle">Data flow / LLM call</text>
    <line x1="200" y1="38" x2="226" y2="38" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
    <text x="234" y="42" class="subtitle">Build / deploy</text>
  </g>

  <!-- =====================================================================
       LAYER 1 — MAIN HORIZONTAL FLOW
                      USERS → FRONTEND → BACKEND → STORAGE
       ===================================================================== -->

  <!-- ── USERS ───────────────────────────────────────────────────────── -->
  <text x="50" y="118" class="group-label">USERS</text>
  <rect x="40" y="128" width="170" height="220" rx="14" ry="14" class="group-bg"/>
  <g transform="translate(85,162)">
    <circle cx="20" cy="20" r="14" fill="#0A0A0A"/>
    <path d="M-2 60 Q20 36 42 60 L42 72 L-2 72 Z" fill="#0A0A0A"/>
    <circle cx="42" cy="20" r="14" fill="#0A0A0A" opacity="0.5"/>
    <path d="M20 60 Q42 36 64 60 L64 72 L20 72 Z" fill="#0A0A0A" opacity="0.5"/>
  </g>
  <text x="125" y="274" class="title" text-anchor="middle">Data scientist</text>
  <text x="125" y="292" class="subtitle" text-anchor="middle">browser · uploads</text>
  <text x="125" y="306" class="subtitle" text-anchor="middle">chats · /train · /predict</text>

  <!-- ── FRONTEND (Next.js) ─────────────────────────────────────────── -->
  <text x="262" y="118" class="group-label">WEB · NEXT.JS 16</text>
  <rect x="252" y="128" width="328" height="320" rx="14" ry="14" class="group-bg"/>

  <rect x="270" y="148" width="292" height="86" class="box-app"/>
  <text x="284" y="170" class="title-lg">Next.js 16 Frontend</text>
  <text x="284" y="188" class="subtitle">React 19 · MUI · Tailwind · Plotly</text>
  <text x="284" y="204" class="subtitle">ChatPanel · DatasetPicker · ModelsPanel</text>
  <text x="284" y="220" class="subtitle">TrainConfigPanel · PredictionResultCard</text>
  <rect x="498" y="210" width="56" height="16" rx="3" fill="#0A0A0A"/>
  <text x="526" y="222" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">NEXT</text>

  <rect x="270" y="250" width="292" height="76" class="box"/>
  <text x="284" y="270" class="title">API routes (thin proxy)</text>
  <text x="284" y="288" class="subtitle">/api/chat · /api/train · /api/predict</text>
  <text x="284" y="302" class="subtitle">/api/datasets · /api/conversations</text>
  <text x="284" y="318" class="subtitle">/api/insights · /api/documents</text>

  <rect x="270" y="342" width="138" height="92" class="box"/>
  <text x="284" y="362" class="title">NextAuth v5</text>
  <text x="284" y="380" class="subtitle">Google OAuth</text>
  <text x="284" y="394" class="subtitle">PrismaAdapter</text>
  <text x="284" y="412" class="subtitle">DB-backed sessions</text>

  <rect x="424" y="342" width="138" height="92" class="box"/>
  <text x="438" y="362" class="title">Prisma ORM</text>
  <text x="438" y="380" class="subtitle">SQLite (dev)</text>
  <text x="438" y="394" class="subtitle">MongoDB (prod)</text>
  <text x="438" y="412" class="subtitle">→ Database</text>

  <!-- ── BACKEND (FastAPI) ──────────────────────────────────────────── -->
  <text x="630" y="118" class="group-label">BACKEND · FASTAPI</text>
  <rect x="620" y="128" width="396" height="500" rx="14" ry="14" class="group-bg-orange"/>

  <rect x="638" y="148" width="360" height="62" class="box-orange"/>
  <text x="652" y="170" class="title-lg">FastAPI (uvicorn :8000)</text>
  <text x="652" y="188" class="subtitle">Pydantic v2 · CORS · /chat /train /predict /insights …</text>
  <rect x="940" y="178" width="48" height="16" rx="3" fill="#FFC000"/>
  <text x="964" y="190" font-size="9" font-weight="700" fill="#0A0A0A" text-anchor="middle">PY</text>

  <rect x="638" y="222" width="360" height="56" class="box"/>
  <text x="652" y="242" class="title">Two-stage AI routing</text>
  <text x="652" y="258" class="subtitle">① Category router (7 cats, ~150 tok)</text>
  <text x="652" y="272" class="subtitle">② Focused planner → JSON plan (handlers + codegen)</text>

  <text x="638" y="302" class="group-label">AGENTS</text>
  <rect x="638" y="308" width="172" height="34" class="box"/>
  <text x="724" y="329" class="pill-text" text-anchor="middle">DS-Agent (orchestrator)</text>
  <rect x="826" y="308" width="172" height="34" class="box"/>
  <text x="912" y="329" class="pill-text" text-anchor="middle">TrainAgent · /train</text>

  <rect x="638" y="350" width="172" height="34" class="box"/>
  <text x="724" y="371" class="pill-text" text-anchor="middle">PredictAgent · /predict</text>
  <rect x="826" y="350" width="172" height="34" class="box"/>
  <text x="912" y="371" class="pill-text" text-anchor="middle">AutoClean · AutoPrepare</text>

  <rect x="638" y="392" width="172" height="34" class="box"/>
  <text x="724" y="413" class="pill-text" text-anchor="middle">Insights · Document</text>
  <rect x="826" y="392" width="172" height="34" class="box"/>
  <text x="912" y="413" class="pill-text" text-anchor="middle">Coding-Agent (Q&amp;A)</text>

  <rect x="638" y="440" width="360" height="62" class="box"/>
  <text x="652" y="460" class="title">HANDLER_REGISTRY · 417 handlers</text>
  <text x="652" y="478" class="subtitle">stats(56) · clean(60) · transform(64) · viz(56)</text>
  <text x="652" y="492" class="subtitle">feature(63) · nlp(56) · analysis(62)</text>

  <rect x="638" y="514" width="172" height="98" class="box"/>
  <text x="652" y="534" class="title">Sandboxed exec()</text>
  <text x="652" y="552" class="subtitle">pandas · sklearn</text>
  <text x="652" y="566" class="subtitle">plotly · seaborn</text>
  <text x="652" y="580" class="subtitle">xgboost · lightgbm</text>
  <text x="652" y="594" class="subtitle">optuna · imbalanced</text>

  <rect x="826" y="514" width="172" height="98" class="box"/>
  <text x="840" y="534" class="title">Model registry</text>
  <text x="840" y="552" class="subtitle">27 algorithms</text>
  <text x="840" y="566" class="subtitle">12 chart types</text>
  <text x="840" y="580" class="subtitle">CV + Optuna</text>
  <text x="840" y="594" class="subtitle">SHAP (Sprint 5+)</text>

  <!-- ── STORAGE ──────────────────────────────────────────────────── -->
  <text x="1066" y="118" class="group-label">STORAGE</text>
  <rect x="1056" y="128" width="404" height="320" rx="14" ry="14" class="group-bg"/>

  <rect x="1074" y="148" width="368" height="86" class="box"/>
  <text x="1088" y="170" class="title">Database (via Prisma)</text>
  <text x="1088" y="188" class="subtitle">User · Session · Account</text>
  <text x="1088" y="204" class="subtitle">Conversation · Dataset</text>
  <text x="1088" y="222" class="subtitle">SQLite (dev) → MongoDB Atlas (Sprint 8)</text>

  <rect x="1074" y="250" width="368" height="86" class="box-orange"/>
  <text x="1088" y="270" class="title">ml-datascience/models/</text>
  <text x="1088" y="288" class="subtitle">{uuid}.joblib — compressed model bundle</text>
  <text x="1088" y="304" class="subtitle">{uuid}.json — metadata sidecar</text>
  <text x="1088" y="322" class="subtitle">display_name · saved_to_library · metrics</text>

  <rect x="1074" y="352" width="368" height="80" class="box"/>
  <text x="1088" y="372" class="title">Dataset blobs</text>
  <text x="1088" y="390" class="subtitle">JSON rows + columns inline in DB</text>
  <text x="1088" y="406" class="subtitle">→ Sprint 8 → S3 / GCS object storage</text>
  <text x="1088" y="422" class="subtitle">cap: 50 MB upload (Sprint 7)</text>

  <!-- =====================================================================
       SERVICES — moved DOWN here, directly BELOW BACKEND (same x range)
       ===================================================================== -->
  <text x="630" y="660" class="group-label">SERVICES — LLM PROVIDERS</text>
  <rect x="620" y="668" width="396" height="100" rx="14" ry="14" class="group-bg-blue"/>

  <rect x="638" y="688" width="170" height="64" class="box"/>
  <circle cx="654" cy="715" r="7" fill="#10A37F"/>
  <text x="668" y="712" class="title">OpenAI GPT</text>
  <text x="668" y="728" class="subtitle">gpt-4o-mini (default)</text>
  <text x="668" y="742" class="subtitle">env: OPENAI_API_KEY</text>

  <rect x="826" y="688" width="170" height="64" class="box"/>
  <circle cx="842" cy="715" r="7" fill="#D97757"/>
  <text x="856" y="712" class="title">Anthropic Claude</text>
  <text x="856" y="728" class="subtitle">claude-sonnet-4-6</text>
  <text x="856" y="742" class="subtitle">env: ANTHROPIC_API_KEY</text>

  <!-- =====================================================================
       LAYER 2 — INFRA (CI/CD + HOSTING) — bottom row
       ===================================================================== -->

  <text x="50" y="668" class="group-label">CI / CD</text>
  <rect x="40" y="678" width="540" height="128" rx="14" ry="14" class="group-bg"/>
  <rect x="58" y="698" width="240" height="92" class="box"/>
  <circle cx="76" cy="728" r="9" fill="#0A0A0A"/>
  <text x="94" y="723" class="title">GitHub Actions</text>
  <text x="94" y="740" class="subtitle">build · type-check (tsc)</text>
  <text x="94" y="754" class="subtitle">pytest · vitest (Sprint 6)</text>
  <text x="94" y="770" class="subtitle">coverage gate ≥ 80%</text>

  <rect x="316" y="698" width="248" height="92" class="box"/>
  <text x="330" y="723" class="title">Local dev launcher</text>
  <text x="330" y="740" class="subtitle">installation-core/run.py</text>
  <text x="330" y="754" class="subtitle">— installs venv + npm deps</text>
  <text x="330" y="770" class="subtitle">— starts both servers</text>

  <text x="1066" y="660" class="group-label">HOSTING</text>
  <rect x="1056" y="668" width="404" height="100" rx="14" ry="14" class="group-bg"/>
  <rect x="1074" y="688" width="170" height="64" class="box"/>
  <text x="1088" y="710" class="title">Docker Compose</text>
  <text x="1088" y="726" class="subtitle">today — single host</text>
  <text x="1088" y="740" class="subtitle">via run.py --docker</text>

  <rect x="1262" y="688" width="180" height="64" class="box"/>
  <text x="1276" y="710" class="title">Vercel + Cloud Run</text>
  <text x="1276" y="726" class="subtitle">planned — Sprint 8</text>
  <text x="1276" y="740" class="subtitle">+ MongoDB Atlas + S3</text>

  <!-- =====================================================================
       ARROWS — every line in its own clear lane, none cross
       ===================================================================== -->

  <!-- Users → Frontend (lane y = 238) -->
  <line x1="212" y1="238" x2="248" y2="238" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="218" y="230" class="arrow-label">HTTPS</text>

  <!-- Frontend → Backend (lane y = 288) -->
  <line x1="582" y1="288" x2="616" y2="288" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
  <text x="582" y="280" class="arrow-label-orange">proxy</text>

  <!-- Backend → Storage (lane y = 284) -->
  <line x1="1018" y1="284" x2="1052" y2="284" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
  <text x="1020" y="276" class="arrow-label-orange">save / load</text>

  <!-- Backend ↔ Services (single short vertical bus, directly below backend) -->
  <line x1="800" y1="630" x2="800" y2="664" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="710" y="650" class="arrow-label" text-anchor="end">LLM call</text>
  <line x1="836" y1="664" x2="836" y2="630" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="848" y="650" class="arrow-label">response</text>

  <!-- Frontend → CI/CD (vertical down) -->
  <line x1="310" y1="450" x2="310" y2="674" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
  <text x="320" y="568" class="arrow-label">dev push</text>

  <!-- Storage → Hosting (deploy lane, vertical down on right) -->
  <line x1="1258" y1="450" x2="1258" y2="664" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
  <text x="1268" y="568" class="arrow-label">deploy</text>
</svg>
