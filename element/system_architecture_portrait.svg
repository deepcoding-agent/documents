<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFC000"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8390"/>
    </marker>
    <style>
      .group-bg          { fill: #F2F4F7; stroke: #D6DBE2; stroke-width: 1; }
      .group-bg-orange   { fill: #FFF8E1; stroke: #FFE082; stroke-width: 1; }
      .group-bg-blue     { fill: #EEF4FF; stroke: #D2DEF7; stroke-width: 1; }
      .group-label       { font-size: 13px; font-weight: 800; fill: #5B6470; letter-spacing: 1px; }
      .box               { fill: #FFFFFF; stroke: #C9D0DA; stroke-width: 1.2; rx: 10; ry: 10; }
      .box-app           { fill: #FFFFFF; stroke: #1F2937; stroke-width: 1.6; rx: 12; ry: 12; }
      .box-orange        { fill: #FFFFFF; stroke: #FFC000; stroke-width: 1.6; rx: 12; ry: 12; }
      .title             { font-size: 14px; font-weight: 700; fill: #0A0A0A; }
      .title-lg          { font-size: 16px; font-weight: 800; fill: #0A0A0A; }
      .subtitle          { font-size: 11px; fill: #6B6B6B; }
      .pill-text         { font-size: 11px; fill: #0A0A0A; font-weight: 600; }
      .arrow-line        { stroke: #222;    stroke-width: 1.8; fill: none; }
      .arrow-line-orange { stroke: #FFC000; stroke-width: 2.0; fill: none; }
      .arrow-line-gray   { stroke: #7A8390; stroke-width: 1.6; fill: none; }
      .arrow-label       { font-size: 11px; font-weight: 700; fill: #444; }
      .arrow-label-orange{ font-size: 11px; font-weight: 700; fill: #FFC000; }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="1100" height="1480" fill="#FFFFFF"/>

  <!-- =====================================================================
       LEGEND (top, full width)
       ===================================================================== -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="1060" height="50" rx="10" ry="10" fill="#FFFFFF" stroke="#E5E4E1" stroke-width="1.2"/>
    <line x1="20" y1="25" x2="46" y2="25" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
    <text x="54" y="29" class="subtitle">Hot path (chat → train → predict)</text>
    <line x1="380" y1="25" x2="406" y2="25" class="arrow-line" marker-end="url(#arrow)"/>
    <text x="414" y="29" class="subtitle">Data flow / LLM call</text>
    <line x1="700" y1="25" x2="726" y2="25" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
    <text x="734" y="29" class="subtitle">Build / deploy</text>
  </g>

  <!-- =====================================================================
       LAYER 1 — USERS (compact horizontal band)
       ===================================================================== -->
  <text x="30" y="100" class="group-label">USERS</text>
  <rect x="20" y="108" width="1060" height="100" rx="14" ry="14" class="group-bg"/>
  <g transform="translate(60,128)">
    <circle cx="20" cy="20" r="14" fill="#0A0A0A"/>
    <path d="M-2 60 Q20 36 42 60 L42 70 L-2 70 Z" fill="#0A0A0A"/>
    <circle cx="42" cy="20" r="14" fill="#0A0A0A" opacity="0.5"/>
    <path d="M20 60 Q42 36 64 60 L64 70 L20 70 Z" fill="#0A0A0A" opacity="0.5"/>
  </g>
  <text x="200" y="148" class="title-lg">Data scientist</text>
  <text x="200" y="170" class="subtitle">Browser · uploads datasets · chats with the AI agent</text>
  <text x="200" y="186" class="subtitle">Slash commands: /cleaning · /ml-prepare · /train · /predict · /insights · /report</text>

  <!-- USERS → FRONTEND -->
  <line x1="550" y1="208" x2="550" y2="240" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="560" y="228" class="arrow-label">HTTPS</text>

  <!-- =====================================================================
       LAYER 2 — FRONTEND (full width)
       ===================================================================== -->
  <text x="30" y="262" class="group-label">WEB · NEXT.JS 16</text>
  <rect x="20" y="270" width="1060" height="270" rx="14" ry="14" class="group-bg"/>

  <rect x="40" y="290" width="1020" height="78" class="box-app"/>
  <text x="54" y="312" class="title-lg">Next.js 16 Frontend</text>
  <text x="54" y="332" class="subtitle">React 19 · MUI · Tailwind · Plotly · Framer Motion</text>
  <text x="54" y="350" class="subtitle">ChatPanel · DatasetPicker · ModelsPanel · TrainConfigPanel · PredictionResultCard · EDA · Insights · Document</text>
  <rect x="996" y="340" width="56" height="16" rx="3" fill="#0A0A0A"/>
  <text x="1024" y="352" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">NEXT</text>

  <rect x="40" y="378" width="1020" height="68" class="box"/>
  <text x="54" y="398" class="title">API routes (thin proxy — no ML logic in TS)</text>
  <text x="54" y="416" class="subtitle">/api/chat · /api/train · /api/predict · /api/datasets · /api/conversations</text>
  <text x="54" y="432" class="subtitle">/api/insights · /api/documents · /api/auto-clean · /api/auto-prepare · /api/eda-report</text>

  <rect x="40" y="456" width="505" height="74" class="box"/>
  <text x="54" y="476" class="title">NextAuth v5 — Google OAuth</text>
  <text x="54" y="494" class="subtitle">PrismaAdapter · DB-backed sessions</text>
  <text x="54" y="510" class="subtitle">Google sign-in flow at /login</text>

  <rect x="555" y="456" width="505" height="74" class="box"/>
  <text x="569" y="476" class="title">Prisma ORM</text>
  <text x="569" y="494" class="subtitle">SQLite (dev) · MongoDB (prod)</text>
  <text x="569" y="510" class="subtitle">User · Session · Conversation · Dataset</text>

  <!-- FRONTEND → BACKEND -->
  <line x1="550" y1="540" x2="550" y2="572" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
  <text x="560" y="560" class="arrow-label-orange">proxy</text>

  <!-- =====================================================================
       LAYER 3 — BACKEND (left 2/3) + SERVICES (right 1/3, side-attached)
       ===================================================================== -->

  <!-- ── BACKEND ──────────────────────────────────────────────────── -->
  <text x="30" y="594" class="group-label">BACKEND · FASTAPI</text>
  <rect x="20" y="602" width="730" height="468" rx="14" ry="14" class="group-bg-orange"/>

  <rect x="40" y="622" width="690" height="58" class="box-orange"/>
  <text x="54" y="644" class="title-lg">FastAPI (uvicorn :8000)</text>
  <text x="54" y="662" class="subtitle">Pydantic v2 · CORS · /chat /train /predict /insights /documents …</text>
  <rect x="678" y="652" width="48" height="16" rx="3" fill="#FFC000"/>
  <text x="702" y="664" font-size="9" font-weight="700" fill="#0A0A0A" text-anchor="middle">PY</text>

  <rect x="40" y="690" width="690" height="56" class="box"/>
  <text x="54" y="710" class="title">Two-stage AI routing</text>
  <text x="54" y="728" class="subtitle">① Category router — classifies into 1–3 of 7 categories (~150 tok)</text>
  <text x="54" y="742" class="subtitle">② Focused planner — JSON plan: handlers + codegen fallback</text>

  <text x="40" y="772" class="group-label">AGENTS</text>
  <rect x="40" y="778" width="337" height="34" class="box"/>
  <text x="208" y="799" class="pill-text" text-anchor="middle">DS-Agent (orchestrator)</text>
  <rect x="393" y="778" width="337" height="34" class="box"/>
  <text x="561" y="799" class="pill-text" text-anchor="middle">TrainAgent · /train</text>

  <rect x="40" y="820" width="337" height="34" class="box"/>
  <text x="208" y="841" class="pill-text" text-anchor="middle">PredictAgent · /predict</text>
  <rect x="393" y="820" width="337" height="34" class="box"/>
  <text x="561" y="841" class="pill-text" text-anchor="middle">AutoClean · AutoPrepare</text>

  <rect x="40" y="862" width="337" height="34" class="box"/>
  <text x="208" y="883" class="pill-text" text-anchor="middle">Insights · Document</text>
  <rect x="393" y="862" width="337" height="34" class="box"/>
  <text x="561" y="883" class="pill-text" text-anchor="middle">Coding-Agent (Q&amp;A)</text>

  <rect x="40" y="906" width="690" height="62" class="box"/>
  <text x="54" y="926" class="title">HANDLER_REGISTRY · 417 handlers</text>
  <text x="54" y="944" class="subtitle">stats(56) · clean(60) · transform(64) · viz(56)</text>
  <text x="54" y="958" class="subtitle">feature(63) · nlp(56) · analysis(62)</text>

  <rect x="40" y="978" width="337" height="78" class="box"/>
  <text x="54" y="998" class="title">Sandboxed exec()</text>
  <text x="54" y="1016" class="subtitle">pandas · sklearn · plotly · seaborn</text>
  <text x="54" y="1030" class="subtitle">xgboost · lightgbm · optuna · imbalanced</text>
  <text x="54" y="1046" class="subtitle">missingno · boruta · auto-retry on error</text>

  <rect x="393" y="978" width="337" height="78" class="box"/>
  <text x="407" y="998" class="title">Model registry</text>
  <text x="407" y="1016" class="subtitle">27 algorithms (12 clf + 11 reg + 4 cluster)</text>
  <text x="407" y="1030" class="subtitle">12 chart types · CV + Optuna tuning</text>
  <text x="407" y="1046" class="subtitle">SHAP explainability (Sprint 5+)</text>

  <!-- ── SERVICES (right column, side-attached to BACKEND) ──────────── -->
  <text x="780" y="594" class="group-label">SERVICES — LLM</text>
  <rect x="770" y="602" width="310" height="200" rx="14" ry="14" class="group-bg-blue"/>

  <rect x="788" y="622" width="274" height="78" class="box"/>
  <circle cx="804" cy="649" r="7" fill="#10A37F"/>
  <text x="818" y="646" class="title">OpenAI GPT</text>
  <text x="818" y="664" class="subtitle">gpt-4o-mini (default)</text>
  <text x="818" y="680" class="subtitle">primary LLM provider</text>
  <text x="818" y="694" class="subtitle">env: OPENAI_API_KEY</text>

  <rect x="788" y="710" width="274" height="78" class="box"/>
  <circle cx="804" cy="737" r="7" fill="#D97757"/>
  <text x="818" y="734" class="title">Anthropic Claude</text>
  <text x="818" y="752" class="subtitle">claude-sonnet-4-6</text>
  <text x="818" y="768" class="subtitle">fallback / heavy reasoning</text>
  <text x="818" y="782" class="subtitle">env: ANTHROPIC_API_KEY</text>

  <!-- BACKEND ↔ SERVICES (LLM bus, horizontal between the two columns) -->
  <line x1="752" y1="660" x2="768" y2="660" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="752" y="652" class="arrow-label" text-anchor="end">LLM</text>
  <line x1="768" y1="748" x2="752" y2="748" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="752" y="740" class="arrow-label" text-anchor="end">resp</text>

  <!-- BACKEND → STORAGE -->
  <line x1="384" y1="1070" x2="384" y2="1102" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
  <text x="394" y="1090" class="arrow-label-orange">save / load</text>

  <!-- =====================================================================
       LAYER 4 — STORAGE (full width)
       ===================================================================== -->
  <text x="30" y="1124" class="group-label">STORAGE</text>
  <rect x="20" y="1132" width="1060" height="170" rx="14" ry="14" class="group-bg"/>

  <rect x="40" y="1152" width="340" height="130" class="box"/>
  <text x="54" y="1174" class="title">Database (via Prisma)</text>
  <text x="54" y="1194" class="subtitle">User · Session · Account</text>
  <text x="54" y="1210" class="subtitle">Conversation · Dataset</text>
  <text x="54" y="1226" class="subtitle">SQLite (dev)</text>
  <text x="54" y="1242" class="subtitle">→ MongoDB Atlas (Sprint 8)</text>
  <text x="54" y="1262" class="subtitle">accessed by both /api/* and FastAPI</text>

  <rect x="390" y="1152" width="320" height="130" class="box-orange"/>
  <text x="404" y="1174" class="title">ml-datascience/models/</text>
  <text x="404" y="1194" class="subtitle">{uuid}.joblib — bundle</text>
  <text x="404" y="1210" class="subtitle">{uuid}.json — metadata</text>
  <text x="404" y="1226" class="subtitle">display_name · saved_to_library</text>
  <text x="404" y="1242" class="subtitle">metrics · hyperparameters</text>
  <text x="404" y="1262" class="subtitle">written by TrainAgent · read by PredictAgent</text>

  <rect x="720" y="1152" width="340" height="130" class="box"/>
  <text x="734" y="1174" class="title">Dataset blobs</text>
  <text x="734" y="1194" class="subtitle">JSON rows + columns inline in DB</text>
  <text x="734" y="1210" class="subtitle">cap: 50 MB upload (Sprint 7)</text>
  <text x="734" y="1226" class="subtitle">→ Sprint 8 → S3 / GCS object storage</text>
  <text x="734" y="1242" class="subtitle">supports 20+ formats</text>
  <text x="734" y="1262" class="subtitle">CSV · XLSX · JSON · TXT · YAML · …</text>

  <!-- =====================================================================
       LAYER 5 — CI/CD + HOSTING (bottom row)
       ===================================================================== -->

  <text x="30" y="1326" class="group-label">CI / CD</text>
  <rect x="20" y="1334" width="510" height="130" rx="14" ry="14" class="group-bg"/>
  <rect x="40" y="1354" width="234" height="92" class="box"/>
  <circle cx="58" cy="1384" r="9" fill="#0A0A0A"/>
  <text x="76" y="1379" class="title">GitHub Actions</text>
  <text x="76" y="1396" class="subtitle">build · type-check (tsc)</text>
  <text x="76" y="1410" class="subtitle">pytest · vitest (Sprint 6)</text>
  <text x="76" y="1426" class="subtitle">coverage gate ≥ 80%</text>

  <rect x="284" y="1354" width="234" height="92" class="box"/>
  <text x="298" y="1379" class="title">Local dev launcher</text>
  <text x="298" y="1396" class="subtitle">installation-core/run.py</text>
  <text x="298" y="1410" class="subtitle">— installs venv + npm deps</text>
  <text x="298" y="1426" class="subtitle">— starts both servers</text>

  <text x="560" y="1326" class="group-label">HOSTING</text>
  <rect x="550" y="1334" width="530" height="130" rx="14" ry="14" class="group-bg"/>
  <rect x="568" y="1354" width="166" height="92" class="box"/>
  <text x="582" y="1378" class="title">Docker</text>
  <text x="582" y="1396" class="subtitle">today — single host</text>
  <text x="582" y="1410" class="subtitle">web-app + ml-datascience</text>
  <text x="582" y="1426" class="subtitle">via run.py --docker</text>

  <rect x="744" y="1354" width="166" height="92" class="box"/>
  <text x="758" y="1378" class="title">Vercel (frontend)</text>
  <text x="758" y="1396" class="subtitle">planned — edge</text>
  <text x="758" y="1410" class="subtitle">preview URLs per PR</text>
  <text x="758" y="1426" class="subtitle">CDN + image opt</text>

  <rect x="920" y="1354" width="146" height="92" class="box"/>
  <text x="934" y="1378" class="title">Cloud Run</text>
  <text x="934" y="1396" class="subtitle">planned — FastAPI</text>
  <text x="934" y="1410" class="subtitle">+ MongoDB Atlas</text>
  <text x="934" y="1426" class="subtitle">+ S3 (Sprint 8)</text>

  <!-- CI/CD → HOSTING -->
  <line x1="532" y1="1410" x2="548" y2="1410" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
  <text x="532" y="1402" class="arrow-label" text-anchor="end">deploy</text>
</svg>
