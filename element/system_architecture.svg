<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFC000"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8390"/>
    </marker>
    <style>
      .group-bg          { fill: #F2F4F7; stroke: #D6DBE2; stroke-width: 1; }
      .group-bg-orange   { fill: #FFF8E1; stroke: #FFE082; stroke-width: 1; }
      .group-bg-blue     { fill: #EEF4FF; stroke: #D2DEF7; stroke-width: 1; }
      .group-label       { font-size: 13px; font-weight: 800; fill: #5B6470; letter-spacing: 1px; }
      .box               { fill: #FFFFFF; stroke: #C9D0DA; stroke-width: 1.2; rx: 10; ry: 10; }
      .box-app           { fill: #FFFFFF; stroke: #1F2937; stroke-width: 1.6; rx: 12; ry: 12; }
      .box-orange        { fill: #FFFFFF; stroke: #FFC000; stroke-width: 1.6; rx: 12; ry: 12; }
      .title             { font-size: 14px; font-weight: 700; fill: #0A0A0A; }
      .title-lg          { font-size: 16px; font-weight: 800; fill: #0A0A0A; }
      .subtitle          { font-size: 11px; fill: #6B6B6B; }
      .pill-text         { font-size: 11px; fill: #0A0A0A; font-weight: 600; }
      .arrow-line        { stroke: #222;    stroke-width: 1.8; fill: none; }
      .arrow-line-orange { stroke: #FFC000; stroke-width: 2.0; fill: none; }
      .arrow-line-gray   { stroke: #7A8390; stroke-width: 1.6; fill: none; }
      .arrow-label       { font-size: 11px; font-weight: 700; fill: #444; }
      .arrow-label-orange{ font-size: 11px; font-weight: 700; fill: #FFC000; }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="1500" height="1050" fill="#FFFFFF"/>

  <!-- =====================================================================
       LEGEND (top-right, fills the space where the title used to be)
       ===================================================================== -->
  <g transform="translate(1100,20)">
    <rect x="0" y="0" width="380" height="60" rx="10" ry="10" fill="#FFFFFF" stroke="#E5E4E1" stroke-width="1.2"/>
    <line x1="14" y1="20" x2="40" y2="20" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
    <text x="48" y="24" class="subtitle">Hot path (chat → train → predict)</text>
    <line x1="14" y1="38" x2="40" y2="38" class="arrow-line" marker-end="url(#arrow)"/>
    <text x="48" y="42" class="subtitle">Data flow / LLM call</text>
    <line x1="200" y1="38" x2="226" y2="38" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
    <text x="234" y="42" class="subtitle">Build / deploy</text>
  </g>

  <!-- =====================================================================
       LAYER 1 — SERVICES (top, single LLM bus)
       ===================================================================== -->
  <text x="610" y="48" class="group-label">SERVICES — LLM PROVIDERS</text>
  <rect x="600" y="56" width="400" height="84" rx="14" ry="14" class="group-bg-blue"/>
  <rect x="618" y="74" width="174" height="50" class="box"/>
  <circle cx="635" cy="99" r="7" fill="#10A37F"/>
  <text x="650" y="96" class="title">OpenAI GPT</text>
  <text x="650" y="111" class="subtitle">gpt-4o-mini (default)</text>
  <rect x="808" y="74" width="174" height="50" class="box"/>
  <circle cx="825" cy="99" r="7" fill="#D97757"/>
  <text x="840" y="96" class="title">Anthropic Claude</text>
  <text x="840" y="111" class="subtitle">claude-sonnet-4-6</text>

  <!-- =====================================================================
       LAYER 2 — MAIN HORIZONTAL FLOW
                      USERS → FRONTEND → BACKEND → STORAGE
       ===================================================================== -->

  <!-- ── USERS ───────────────────────────────────────────────────────── -->
  <text x="50" y="196" class="group-label">USERS</text>
  <rect x="40" y="206" width="170" height="220" rx="14" ry="14" class="group-bg"/>
  <g transform="translate(85,240)">
    <circle cx="20" cy="20" r="14" fill="#0A0A0A"/>
    <path d="M-2 60 Q20 36 42 60 L42 72 L-2 72 Z" fill="#0A0A0A"/>
    <circle cx="42" cy="20" r="14" fill="#0A0A0A" opacity="0.5"/>
    <path d="M20 60 Q42 36 64 60 L64 72 L20 72 Z" fill="#0A0A0A" opacity="0.5"/>
  </g>
  <text x="125" y="352" class="title" text-anchor="middle">Data scientist</text>
  <text x="125" y="370" class="subtitle" text-anchor="middle">browser · uploads</text>
  <text x="125" y="384" class="subtitle" text-anchor="middle">chats · /train · /predict</text>

  <!-- ── FRONTEND (Next.js) ─────────────────────────────────────────── -->
  <text x="262" y="196" class="group-label">WEB · NEXT.JS 16</text>
  <rect x="252" y="206" width="328" height="320" rx="14" ry="14" class="group-bg"/>

  <rect x="270" y="226" width="292" height="86" class="box-app"/>
  <text x="284" y="248" class="title-lg">Next.js 16 Frontend</text>
  <text x="284" y="266" class="subtitle">React 19 · MUI · Tailwind · Plotly</text>
  <text x="284" y="282" class="subtitle">ChatPanel · DatasetPicker · ModelsPanel</text>
  <text x="284" y="298" class="subtitle">TrainConfigPanel · PredictionResultCard</text>
  <rect x="498" y="288" width="56" height="16" rx="3" fill="#0A0A0A"/>
  <text x="526" y="300" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">NEXT</text>

  <rect x="270" y="328" width="292" height="76" class="box"/>
  <text x="284" y="348" class="title">API routes (thin proxy)</text>
  <text x="284" y="366" class="subtitle">/api/chat · /api/train · /api/predict</text>
  <text x="284" y="380" class="subtitle">/api/datasets · /api/conversations</text>
  <text x="284" y="396" class="subtitle">/api/insights · /api/documents</text>

  <rect x="270" y="420" width="138" height="92" class="box"/>
  <text x="284" y="440" class="title">NextAuth v5</text>
  <text x="284" y="458" class="subtitle">Google OAuth</text>
  <text x="284" y="472" class="subtitle">PrismaAdapter</text>
  <text x="284" y="490" class="subtitle">DB-backed sessions</text>

  <rect x="424" y="420" width="138" height="92" class="box"/>
  <text x="438" y="440" class="title">Prisma ORM</text>
  <text x="438" y="458" class="subtitle">SQLite (dev)</text>
  <text x="438" y="472" class="subtitle">MongoDB (prod)</text>
  <text x="438" y="490" class="subtitle">→ Database</text>

  <!-- ── BACKEND (FastAPI) ──────────────────────────────────────────── -->
  <text x="630" y="196" class="group-label">BACKEND · FASTAPI</text>
  <rect x="620" y="206" width="396" height="500" rx="14" ry="14" class="group-bg-orange"/>

  <rect x="638" y="226" width="360" height="62" class="box-orange"/>
  <text x="652" y="248" class="title-lg">FastAPI (uvicorn :8000)</text>
  <text x="652" y="266" class="subtitle">Pydantic v2 · CORS · /chat /train /predict /insights …</text>
  <rect x="940" y="256" width="48" height="16" rx="3" fill="#FFC000"/>
  <text x="964" y="268" font-size="9" font-weight="700" fill="#0A0A0A" text-anchor="middle">PY</text>

  <rect x="638" y="300" width="360" height="56" class="box"/>
  <text x="652" y="320" class="title">Two-stage AI routing</text>
  <text x="652" y="336" class="subtitle">① Category router (7 cats, ~150 tok)</text>
  <text x="652" y="350" class="subtitle">② Focused planner → JSON plan (handlers + codegen)</text>

  <text x="638" y="380" class="group-label">AGENTS</text>
  <rect x="638" y="386" width="172" height="34" class="box"/>
  <text x="724" y="407" class="pill-text" text-anchor="middle">DS-Agent (orchestrator)</text>
  <rect x="826" y="386" width="172" height="34" class="box"/>
  <text x="912" y="407" class="pill-text" text-anchor="middle">TrainAgent · /train</text>

  <rect x="638" y="428" width="172" height="34" class="box"/>
  <text x="724" y="449" class="pill-text" text-anchor="middle">PredictAgent · /predict</text>
  <rect x="826" y="428" width="172" height="34" class="box"/>
  <text x="912" y="449" class="pill-text" text-anchor="middle">AutoClean · AutoPrepare</text>

  <rect x="638" y="470" width="172" height="34" class="box"/>
  <text x="724" y="491" class="pill-text" text-anchor="middle">Insights · Document</text>
  <rect x="826" y="470" width="172" height="34" class="box"/>
  <text x="912" y="491" class="pill-text" text-anchor="middle">Coding-Agent (Q&amp;A)</text>

  <rect x="638" y="518" width="360" height="62" class="box"/>
  <text x="652" y="538" class="title">HANDLER_REGISTRY · 417 handlers</text>
  <text x="652" y="556" class="subtitle">stats(56) · clean(60) · transform(64) · viz(56)</text>
  <text x="652" y="570" class="subtitle">feature(63) · nlp(56) · analysis(62)</text>

  <rect x="638" y="592" width="172" height="98" class="box"/>
  <text x="652" y="612" class="title">Sandboxed exec()</text>
  <text x="652" y="630" class="subtitle">pandas · sklearn</text>
  <text x="652" y="644" class="subtitle">plotly · seaborn</text>
  <text x="652" y="658" class="subtitle">xgboost · lightgbm</text>
  <text x="652" y="672" class="subtitle">optuna · imbalanced</text>

  <rect x="826" y="592" width="172" height="98" class="box"/>
  <text x="840" y="612" class="title">Model registry</text>
  <text x="840" y="630" class="subtitle">27 algorithms</text>
  <text x="840" y="644" class="subtitle">12 chart types</text>
  <text x="840" y="658" class="subtitle">CV + Optuna</text>
  <text x="840" y="672" class="subtitle">SHAP (Sprint 5+)</text>

  <!-- ── STORAGE ──────────────────────────────────────────────────── -->
  <text x="1066" y="196" class="group-label">STORAGE</text>
  <rect x="1056" y="206" width="404" height="320" rx="14" ry="14" class="group-bg"/>

  <rect x="1074" y="226" width="368" height="86" class="box"/>
  <text x="1088" y="248" class="title">Database (via Prisma)</text>
  <text x="1088" y="266" class="subtitle">User · Session · Account</text>
  <text x="1088" y="282" class="subtitle">Conversation · Dataset</text>
  <text x="1088" y="300" class="subtitle">SQLite (dev) → MongoDB Atlas (Sprint 8)</text>

  <rect x="1074" y="328" width="368" height="86" class="box-orange"/>
  <text x="1088" y="348" class="title">ml-datascience/models/</text>
  <text x="1088" y="366" class="subtitle">{uuid}.joblib — compressed model bundle</text>
  <text x="1088" y="382" class="subtitle">{uuid}.json — metadata sidecar</text>
  <text x="1088" y="400" class="subtitle">display_name · saved_to_library · metrics</text>

  <rect x="1074" y="430" width="368" height="80" class="box"/>
  <text x="1088" y="450" class="title">Dataset blobs</text>
  <text x="1088" y="468" class="subtitle">JSON rows + columns inline in DB</text>
  <text x="1088" y="484" class="subtitle">→ Sprint 8 → S3 / GCS object storage</text>
  <text x="1088" y="500" class="subtitle">cap: 50 MB upload (Sprint 7)</text>

  <!-- =====================================================================
       LAYER 3 — INFRA (CI/CD + HOSTING) — full bottom row
       ===================================================================== -->

  <text x="50" y="748" class="group-label">CI / CD</text>
  <rect x="40" y="758" width="540" height="128" rx="14" ry="14" class="group-bg"/>
  <rect x="58" y="778" width="240" height="92" class="box"/>
  <circle cx="76" cy="808" r="9" fill="#0A0A0A"/>
  <text x="94" y="803" class="title">GitHub Actions</text>
  <text x="94" y="820" class="subtitle">build · type-check (tsc)</text>
  <text x="94" y="834" class="subtitle">pytest · vitest (Sprint 6)</text>
  <text x="94" y="850" class="subtitle">coverage gate ≥ 80%</text>

  <rect x="316" y="778" width="248" height="92" class="box"/>
  <text x="330" y="803" class="title">Local dev launcher</text>
  <text x="330" y="820" class="subtitle">installation-core/run.py</text>
  <text x="330" y="834" class="subtitle">— installs venv + npm deps</text>
  <text x="330" y="850" class="subtitle">— starts both servers</text>

  <text x="630" y="748" class="group-label">HOSTING</text>
  <rect x="620" y="758" width="840" height="128" rx="14" ry="14" class="group-bg"/>
  <rect x="638" y="778" width="260" height="92" class="box"/>
  <text x="652" y="802" class="title">Docker Compose</text>
  <text x="652" y="820" class="subtitle">today — single-host dev/demo</text>
  <text x="652" y="836" class="subtitle">web-app · ml-datascience</text>
  <text x="652" y="852" class="subtitle">via run.py --docker</text>

  <rect x="916" y="778" width="260" height="92" class="box"/>
  <text x="930" y="802" class="title">Vercel (frontend)</text>
  <text x="930" y="820" class="subtitle">planned — edge runtime</text>
  <text x="930" y="836" class="subtitle">preview URLs per PR</text>
  <text x="930" y="852" class="subtitle">CDN + image optimisation</text>

  <rect x="1194" y="778" width="248" height="92" class="box"/>
  <text x="1208" y="802" class="title">Cloud Run / Fly.io</text>
  <text x="1208" y="820" class="subtitle">planned — FastAPI</text>
  <text x="1208" y="836" class="subtitle">+ MongoDB Atlas</text>
  <text x="1208" y="852" class="subtitle">+ S3/GCS for models (Sprint 8)</text>

  <!-- =====================================================================
       ARROWS — every line in its own clear lane, none cross
       ===================================================================== -->

  <!-- Users → Frontend  (lane y = 316) -->
  <line x1="212" y1="316" x2="248" y2="316" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="218" y="308" class="arrow-label">HTTPS</text>

  <!-- Frontend → Backend  (lane y = 366) -->
  <line x1="582" y1="366" x2="616" y2="366" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
  <text x="582" y="358" class="arrow-label-orange">proxy</text>

  <!-- Backend → Storage  (lane y = 362) -->
  <line x1="1018" y1="362" x2="1052" y2="362" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
  <text x="1020" y="354" class="arrow-label-orange">save / load</text>

  <!-- Backend ↔ Services  (single vertical bus) -->
  <line x1="804" y1="226" x2="804" y2="144" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="822" y1="144" x2="822" y2="226" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="700" y="172" class="arrow-label" text-anchor="end">LLM call</text>
  <text x="900" y="172" class="arrow-label" text-anchor="start">response</text>

  <!-- Frontend → CI/CD  (single vertical, lane x=310) -->
  <line x1="310" y1="530" x2="310" y2="754" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
  <text x="320" y="650" class="arrow-label">dev push</text>

  <!-- CI/CD → Hosting  (single horizontal, lane y = 824) -->
  <line x1="582" y1="824" x2="616" y2="824" class="arrow-line-gray" marker-end="url(#arrowGray)"/>
  <text x="582" y="816" class="arrow-label">deploy</text>

  <!-- =====================================================================
       USER FLOW STRIP (bottom)
       ===================================================================== -->
  <rect x="40" y="908" width="1420" height="128" rx="14" ry="14" class="group-bg"/>
  <text x="56" y="930" class="group-label">USER FLOW (E2E — 7 STEPS)</text>

  <rect x="56" y="948" width="184" height="64" class="box"/>
  <text x="148" y="972" class="title" text-anchor="middle">1 · Upload dataset</text>
  <text x="148" y="992" class="subtitle" text-anchor="middle">CSV / XLSX / JSON …</text>
  <text x="148" y="1005" class="subtitle" text-anchor="middle">/api/datasets</text>

  <rect x="254" y="948" width="184" height="64" class="box"/>
  <text x="346" y="972" class="title" text-anchor="middle">2 · Chat / /cleaning</text>
  <text x="346" y="992" class="subtitle" text-anchor="middle">DS-Agent · AutoClean</text>
  <text x="346" y="1005" class="subtitle" text-anchor="middle">handler plan</text>

  <rect x="452" y="948" width="184" height="64" class="box"/>
  <text x="544" y="972" class="title" text-anchor="middle">3 · /ml-prepare</text>
  <text x="544" y="992" class="subtitle" text-anchor="middle">AI picks PrepConfig</text>
  <text x="544" y="1005" class="subtitle" text-anchor="middle">10-step pipeline</text>

  <rect x="650" y="948" width="184" height="64" class="box-orange"/>
  <text x="742" y="972" class="title" text-anchor="middle">4 · /train → .joblib</text>
  <text x="742" y="992" class="subtitle" text-anchor="middle">27 algos · CV · Optuna</text>
  <text x="742" y="1005" class="subtitle" text-anchor="middle">→ TrainResultCard</text>

  <rect x="848" y="948" width="184" height="64" class="box"/>
  <text x="940" y="972" class="title" text-anchor="middle">5 · Save to library</text>
  <text x="940" y="992" class="subtitle" text-anchor="middle">Models tab · rename</text>
  <text x="940" y="1005" class="subtitle" text-anchor="middle">bookmark · delete</text>

  <rect x="1046" y="948" width="184" height="64" class="box-orange"/>
  <text x="1138" y="972" class="title" text-anchor="middle">6 · /predict</text>
  <text x="1138" y="992" class="subtitle" text-anchor="middle">PredictAgent loads .joblib</text>
  <text x="1138" y="1005" class="subtitle" text-anchor="middle">re-applies pipeline</text>

  <rect x="1244" y="948" width="200" height="64" class="box"/>
  <text x="1344" y="972" class="title" text-anchor="middle">7 · Export</text>
  <text x="1344" y="992" class="subtitle" text-anchor="middle">CSV · XLSX · JSON</text>
  <text x="1344" y="1005" class="subtitle" text-anchor="middle">PredictionResultCard</text>

  <!-- arrows between steps -->
  <line x1="240" y1="980" x2="254" y2="980" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="438" y1="980" x2="452" y2="980" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="636" y1="980" x2="650" y2="980" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="834" y1="980" x2="848" y2="980" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
  <line x1="1032" y1="980" x2="1046" y2="980" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="1230" y1="980" x2="1244" y2="980" class="arrow-line-orange" marker-end="url(#arrowOrange)"/>
</svg>
