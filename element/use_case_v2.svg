<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PrepPilot use case diagram">

  <defs>
    <symbol id="iUser" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="currentColor"/>
      <path d="M4 22 C4 16 7.6 14 12 14 C16.4 14 20 16 20 22 Z" fill="currentColor"/>
    </symbol>
    <symbol id="iLock" viewBox="0 0 24 24">
      <rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/>
      <path d="M8 11 V8 C8 5.8 9.8 4 12 4 C14.2 4 16 5.8 16 8 V11" stroke="currentColor" stroke-width="2" fill="none"/>
    </symbol>
    <symbol id="iDb" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="2.6" fill="currentColor"/>
      <path d="M4 5 V19 C4 20.4 7.6 21.6 12 21.6 C16.4 21.6 20 20.4 20 19 V5 Z" fill="currentColor" opacity="0.85"/>
      <ellipse cx="12" cy="12" rx="8" ry="2.2" fill="#FFFFFF" opacity="0.3"/>
    </symbol>
    <symbol id="iSpark" viewBox="0 0 24 24">
      <path d="M12 2 L13.5 9 L21 10.5 L13.5 12 L12 19 L10.5 12 L3 10.5 L10.5 9 Z" fill="currentColor"/>
    </symbol>
    <symbol id="iFolder" viewBox="0 0 24 24">
      <path d="M3 6 C3 5 4 4 5 4 H10 L12 6 H19 C20 6 21 7 21 8 V19 C21 20 20 21 19 21 H5 C4 21 3 20 3 19 Z" fill="currentColor"/>
    </symbol>
    <symbol id="iChat" viewBox="0 0 24 24">
      <path d="M3 5 C3 4 4 3 5 3 H19 C20 3 21 4 21 5 V15 C21 16 20 17 19 17 H10 L5 21 V17 C4 17 3 16 3 15 Z" fill="currentColor"/>
    </symbol>
    <symbol id="iCog" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2 L13 5 L16 4 L17 7 L20 8 L19 11 L22 12 L19 13 L20 16 L17 17 L16 20 L13 19 L12 22 L11 19 L8 20 L7 17 L4 16 L5 13 L2 12 L5 11 L4 8 L7 7 L8 4 L11 5 Z" fill="currentColor"/>
      <circle cx="12" cy="12" r="3.2" fill="#FFFFFF"/>
    </symbol>
    <symbol id="iChart" viewBox="0 0 24 24">
      <rect x="3.5" y="14" width="4" height="6.5" rx="0.6" fill="currentColor"/>
      <rect x="10" y="9" width="4" height="11.5" rx="0.6" fill="currentColor"/>
      <rect x="16.5" y="3.5" width="4" height="17" rx="0.6" fill="currentColor"/>
    </symbol>

    <filter id="shadow" x="-2%" y="-2%" width="104%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.07"/>
    </filter>
    <filter id="softShadow" x="-2%" y="-2%" width="104%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8500A"/>
      <stop offset="100%" stop-color="#FF6B2B"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ── Title ── -->
  <rect x="0" y="0" width="6" height="100" fill="url(#titleAccent)"/>
  <text x="60" y="56" font-size="34" font-weight="800" fill="#0A0A0A" letter-spacing="-0.5">PrepPilot — Use Case Diagram</text>
  <text x="60" y="82" font-size="14" font-weight="500" fill="#6B6B6B">Who does what · 21 use cases grouped by capability · 3 external system actors</text>
  <text x="1860" y="68" font-size="12" fill="#9B9B9B" text-anchor="end">2026-05-19 · Sprint 5.7</text>

  <line x1="40" y1="105" x2="1880" y2="105" stroke="#E5E4E1" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       USER ACTOR (left)                                                              -->
  <g transform="translate(40, 380)" color="#E8500A">
    <circle cx="100" cy="80" r="58" fill="#FFF3EE" stroke="#E8500A" stroke-width="2.5"/>
    <use href="#iUser" x="72" y="52" width="56" height="56"/>
    <text x="100" y="172" font-size="18" font-weight="800" fill="#0A0A0A" text-anchor="middle">User</text>
    <text x="100" y="194" font-size="12" fill="#6B6B6B" text-anchor="middle">Data Scientist · Analyst</text>
  </g>

  <!-- USER → GROUPS · 5 solid orange lines fanning out -->
  <g stroke="#E8500A" stroke-width="2" fill="none">
    <line x1="198" y1="460" x2="280" y2="380"/>
    <line x1="198" y1="460" x2="690" y2="380"/>
    <line x1="198" y1="460" x2="1100" y2="380"/>
    <line x1="198" y1="460" x2="280" y2="700"/>
    <line x1="198" y1="460" x2="1080" y2="700"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       SYSTEM BOUNDARY                                                                 -->
  <g transform="translate(260, 140)" color="#E8500A">
    <rect x="0" y="0" width="1240" height="760" rx="20"
          fill="#FFFDFB" stroke="#E8500A" stroke-width="2.5" stroke-dasharray="10 6"/>

    <!-- System header -->
    <text x="30" y="50" font-size="20" font-weight="800" fill="#E8500A">PrepPilot System</text>
    <text x="30" y="72" font-size="12" fill="#6B6B6B">5 capability groups · 21 use cases</text>

    <!-- ── TOP ROW: 3 groups ── -->

    <!-- Group 1 · AUTH & SESSION -->
    <g transform="translate(20, 100)">
      <rect width="380" height="280" rx="14" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#softShadow)"/>
      <use href="#iLock" x="20" y="18" width="22" height="22"/>
      <text x="50" y="36" font-size="13" font-weight="800" fill="#E8500A" letter-spacing="1">AUTH &amp; SESSION</text>
      <line x1="20" y1="56" x2="360" y2="56" stroke="#FCE0D2" stroke-width="1"/>

      <ellipse cx="190" cy="100" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="105" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Sign in with Google</text>

      <ellipse cx="190" cy="160" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="165" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Manage session</text>

      <ellipse cx="190" cy="220" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="225" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Sign out</text>
    </g>

    <!-- Group 2 · DATA MANAGEMENT -->
    <g transform="translate(430, 100)">
      <rect width="380" height="280" rx="14" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#softShadow)"/>
      <use href="#iFolder" x="20" y="18" width="22" height="22"/>
      <text x="50" y="36" font-size="13" font-weight="800" fill="#E8500A" letter-spacing="1">DATA MANAGEMENT</text>
      <line x1="20" y1="56" x2="360" y2="56" stroke="#FCE0D2" stroke-width="1"/>

      <ellipse cx="190" cy="92" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="97" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Upload dataset</text>

      <ellipse cx="190" cy="142" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="147" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Browse library</text>

      <ellipse cx="190" cy="192" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="197" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Preview rows</text>

      <ellipse cx="190" cy="242" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="247" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Export dataset</text>
    </g>

    <!-- Group 3 · CHAT & CONVERSATION -->
    <g transform="translate(840, 100)">
      <rect width="380" height="280" rx="14" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#softShadow)"/>
      <use href="#iChat" x="20" y="18" width="22" height="22"/>
      <text x="50" y="36" font-size="13" font-weight="800" fill="#E8500A" letter-spacing="1">CHAT &amp; CONVERSATION</text>
      <line x1="20" y1="56" x2="360" y2="56" stroke="#FCE0D2" stroke-width="1"/>

      <ellipse cx="190" cy="92" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="97" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Send message</text>

      <ellipse cx="190" cy="142" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="147" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Pick LLM model</text>

      <ellipse cx="190" cy="192" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="197" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Reply with quote</text>

      <ellipse cx="190" cy="242" rx="150" ry="22" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="247" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Stop generation</text>
    </g>

    <!-- ── BOTTOM ROW: 2 groups ── -->

    <!-- Group 4 · ML PIPELINES (slash commands, wide) -->
    <g transform="translate(20, 410)">
      <rect width="760" height="320" rx="14" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#softShadow)"/>
      <use href="#iCog" x="20" y="18" width="22" height="22"/>
      <text x="50" y="36" font-size="13" font-weight="800" fill="#E8500A" letter-spacing="1">ML PIPELINES · slash commands</text>
      <line x1="20" y1="56" x2="740" y2="56" stroke="#FCE0D2" stroke-width="1"/>

      <!-- 2 columns × 3 rows = 6 use cases -->
      <ellipse cx="190" cy="100" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="98" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" class="mono">/cleaning</text>
      <text x="190" y="113" font-size="10" fill="#6B6B6B" text-anchor="middle">Auto-Clean</text>

      <ellipse cx="570" cy="100" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="570" y="98" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" class="mono">/feature</text>
      <text x="570" y="113" font-size="10" fill="#6B6B6B" text-anchor="middle">Feature Engineering</text>

      <ellipse cx="190" cy="180" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="178" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" class="mono">/train</text>
      <text x="190" y="193" font-size="10" fill="#6B6B6B" text-anchor="middle">Auto ML training</text>

      <ellipse cx="570" cy="180" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="570" y="178" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" class="mono">/predict</text>
      <text x="570" y="193" font-size="10" fill="#6B6B6B" text-anchor="middle">Run inference</text>

      <ellipse cx="190" cy="260" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="190" y="258" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" class="mono">/eda</text>
      <text x="190" y="273" font-size="10" fill="#6B6B6B" text-anchor="middle">Technical analysis</text>

      <ellipse cx="570" cy="260" rx="150" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="570" y="258" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" class="mono">/biz-report</text>
      <text x="570" y="273" font-size="10" fill="#6B6B6B" text-anchor="middle">Business strategy</text>
    </g>

    <!-- Group 5 · OUTPUT & ARTEFACTS -->
    <g transform="translate(820, 410)">
      <rect width="400" height="320" rx="14" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#softShadow)"/>
      <use href="#iChart" x="20" y="18" width="22" height="22"/>
      <text x="50" y="36" font-size="13" font-weight="800" fill="#E8500A" letter-spacing="1">OUTPUT &amp; ARTEFACTS</text>
      <line x1="20" y1="56" x2="380" y2="56" stroke="#FCE0D2" stroke-width="1"/>

      <ellipse cx="200" cy="100" rx="160" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="200" y="105" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">View Plotly chart</text>

      <ellipse cx="200" cy="160" rx="160" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="200" y="165" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">View report card</text>

      <ellipse cx="200" cy="220" rx="160" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="200" y="225" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Download .joblib model</text>

      <ellipse cx="200" cy="280" rx="160" ry="24" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="200" y="285" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Download dataset</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       EXTERNAL SYSTEM ACTORS (right)                                                 -->

  <!-- External 1 · Google OAuth -->
  <g transform="translate(1560, 180)" color="#E8500A">
    <rect x="0" y="0" width="320" height="160" rx="14" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="46" cy="48" r="22" fill="#FFF3EE"/>
    <use href="#iLock" x="31" y="33" width="30" height="30"/>
    <text x="80" y="36" font-size="10" font-weight="800" fill="#9B9B9B" letter-spacing="1.2">«system actor»</text>
    <text x="80" y="58" font-size="16" font-weight="800" fill="#0A0A0A">Google OAuth</text>
    <line x1="20" y1="84" x2="300" y2="84" stroke="#FCE0D2" stroke-width="1"/>
    <text x="20" y="108" font-size="11" fill="#6B6B6B">Identity provider</text>
    <text x="20" y="128" font-size="11" font-weight="700" fill="#E8500A" class="mono">→ Sign in</text>
  </g>

  <!-- External 2 · LLM Providers -->
  <g transform="translate(1560, 380)" color="#E8500A">
    <rect x="0" y="0" width="320" height="160" rx="14" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="46" cy="48" r="22" fill="#FFF3EE"/>
    <use href="#iSpark" x="31" y="33" width="30" height="30"/>
    <text x="80" y="36" font-size="10" font-weight="800" fill="#9B9B9B" letter-spacing="1.2">«system actor»</text>
    <text x="80" y="58" font-size="16" font-weight="800" fill="#0A0A0A">LLM Providers</text>
    <line x1="20" y1="84" x2="300" y2="84" stroke="#FCE0D2" stroke-width="1"/>
    <text x="20" y="108" font-size="11" fill="#6B6B6B">Anthropic · OpenAI</text>
    <text x="20" y="128" font-size="11" font-weight="700" fill="#E8500A" class="mono">→ Chat · all pipelines</text>
  </g>

  <!-- External 3 · MongoDB Atlas -->
  <g transform="translate(1560, 580)" color="#E8500A">
    <rect x="0" y="0" width="320" height="160" rx="14" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="46" cy="48" r="22" fill="#FFF3EE"/>
    <use href="#iDb" x="31" y="33" width="30" height="30"/>
    <text x="80" y="36" font-size="10" font-weight="800" fill="#9B9B9B" letter-spacing="1.2">«system actor»</text>
    <text x="80" y="58" font-size="16" font-weight="800" fill="#0A0A0A">MongoDB Atlas</text>
    <line x1="20" y1="84" x2="300" y2="84" stroke="#FCE0D2" stroke-width="1"/>
    <text x="20" y="108" font-size="11" fill="#6B6B6B">Persistent storage</text>
    <text x="20" y="128" font-size="11" font-weight="700" fill="#E8500A" class="mono">→ Data · Output</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       EXTERNAL → SYSTEM BOUNDARY · dashed lines                                       -->
  <g stroke="#E8500A" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.7">
    <line x1="1560" y1="260" x2="1500" y2="260"/>
    <line x1="1560" y1="460" x2="1500" y2="460"/>
    <line x1="1560" y1="660" x2="1500" y2="660"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       FOOTER LEGEND                                                                   -->
  <g transform="translate(60, 950)">
    <rect width="1800" height="100" rx="14" fill="#FAFAFA" stroke="#E5E4E1" stroke-width="1.5"/>

    <text x="24" y="32" font-size="13" font-weight="800" fill="#0A0A0A">Notation</text>

    <!-- User actor symbol -->
    <g transform="translate(24, 56)">
      <circle cx="14" cy="0" r="12" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <use href="#iUser" x="6" y="-8" width="16" height="16" color="#E8500A"/>
      <text x="36" y="4" font-size="12" fill="#3A3A3A">Primary actor</text>
    </g>

    <!-- System actor symbol -->
    <g transform="translate(180, 56)">
      <rect x="0" y="-10" width="22" height="20" rx="4" fill="#FFFFFF" stroke="#E8500A" stroke-width="1.5"/>
      <text x="32" y="4" font-size="12" fill="#3A3A3A">«system actor» (external)</text>
    </g>

    <!-- Use case ellipse -->
    <g transform="translate(420, 56)">
      <ellipse cx="22" cy="0" rx="22" ry="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
      <text x="56" y="4" font-size="12" fill="#3A3A3A">Use case</text>
    </g>

    <!-- System boundary -->
    <g transform="translate(580, 56)">
      <rect x="0" y="-10" width="22" height="20" rx="4" fill="#FFFDFB" stroke="#E8500A" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="32" y="4" font-size="12" fill="#3A3A3A">System boundary</text>
    </g>

    <!-- Association -->
    <g transform="translate(760, 56)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#E8500A" stroke-width="2"/>
      <text x="40" y="4" font-size="12" fill="#3A3A3A">Association (user ↔ use case)</text>
    </g>

    <!-- External dependency -->
    <g transform="translate(1020, 56)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#E8500A" stroke-width="2" stroke-dasharray="5 3" opacity="0.7"/>
      <text x="40" y="4" font-size="12" fill="#3A3A3A">External dependency</text>
    </g>

    <text x="1760" y="60" font-size="11" fill="#9B9B9B" text-anchor="end" class="mono">PrepPilot · 2026-05-19</text>
  </g>

</svg>