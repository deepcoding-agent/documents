<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PrepPilot /train workflow">

  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L11,5 z" fill="#E8500A"/>
    </marker>
    <marker id="arrowSmall" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#E8500A"/>
    </marker>
    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8500A"/>
      <stop offset="100%" stop-color="#FF6B2B"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <rect x="0" y="0" width="6" height="100" fill="url(#titleAccent)"/>
  <text x="60" y="56" font-size="34" font-weight="800" fill="#0A0A0A" letter-spacing="-0.5">PrepPilot — <tspan class="mono">/train</tspan> Workflow</text>
  <text x="60" y="82" font-size="14" font-weight="500" fill="#6B6B6B">Auto ML training pipeline · CV · Optuna · model persistence</text>
  <text x="1860" y="68" font-size="12" fill="#9B9B9B" text-anchor="end">2026-05-19 · Sprint 5.7</text>

  <line x1="40" y1="105" x2="1880" y2="105" stroke="#E5E4E1" stroke-width="1"/>

  <!-- ● START -->
  <circle cx="960" cy="155" r="26" fill="#E8500A" filter="url(#shadow)"/>
  <text x="960" y="161" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">START</text>

  <line x1="960" y1="182" x2="960" y2="208" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 1: POST /train -->
  <rect x="770" y="212" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="240" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">POST <tspan class="mono">/train</tspan></text>
  <text x="960" y="262" font-size="11" fill="#6B6B6B" text-anchor="middle">HTTP endpoint · load engineered dataset</text>

  <rect x="1180" y="234" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="250" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">df · target</text>

  <line x1="960" y1="280" x2="960" y2="304" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Analyze train -->
  <rect x="770" y="308" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="336" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Train Setup · AI Suggest</text>
  <text x="960" y="358" font-size="11" fill="#6B6B6B" text-anchor="middle" class="mono">train_setup_agent.analyze()</text>

  <rect x="1180" y="330" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="346" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">TrainSuggestion</text>

  <line x1="960" y1="376" x2="960" y2="400" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Setup -->
  <rect x="770" y="404" width="380" height="68" rx="12" fill="#FFF3EE" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="432" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Train Config Panel</text>
  <text x="960" y="454" font-size="11" fill="#6B6B6B" text-anchor="middle">user reviews target · algos · CV · trials</text>

  <rect x="1180" y="426" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="442" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">TrainConfig</text>

  <line x1="960" y1="472" x2="960" y2="496" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: TRAIN PIPELINE (sub-process) -->
  <rect x="500" y="500" width="920" height="200" rx="14" fill="#FFFFFF" stroke="#E8500A" stroke-width="3" filter="url(#shadow)"/>
  <rect x="500" y="500" width="920" height="40" rx="14" fill="#E8500A"/>
  <text x="960" y="528" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Train Loop · <tspan class="mono">train_agent.train()</tspan></text>

  <g transform="translate(520, 560)">
    <!-- Preprocess -->
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="80" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">preprocess</text>
    <text x="80" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">one-hot · scale</text>

    <line x1="162" y1="30" x2="172" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- CV -->
    <rect x="176" y="0" width="160" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="256" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">cross_val_score</text>
    <text x="256" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">K-fold split</text>

    <line x1="338" y1="30" x2="348" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Optuna -->
    <rect x="352" y="0" width="160" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="432" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">optuna.Study</text>
    <text x="432" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">hyperparam search</text>

    <line x1="514" y1="30" x2="524" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Pick best -->
    <rect x="528" y="0" width="160" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="608" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">pick_best</text>
    <text x="608" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">winning algo</text>

    <line x1="690" y1="30" x2="700" y2="30" stroke="#E8500A" stroke-width="2" marker-end="url(#arrowSmall)"/>

    <!-- Fit -->
    <rect x="704" y="0" width="156" height="60" rx="10" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="782" y="24" font-size="12" font-weight="800" fill="#E8500A" text-anchor="middle" class="mono">model.fit</text>
    <text x="782" y="44" font-size="9" fill="#6B6B6B" text-anchor="middle">final training</text>
  </g>

  <text x="960" y="680" font-size="11" font-style="italic" fill="#9B9B9B" text-anchor="middle">loops across 27 algorithms in <tspan class="mono">model_registry</tspan> · picks best by chosen metric</text>

  <line x1="960" y1="700" x2="960" y2="724" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Evaluate -->
  <rect x="770" y="728" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="756" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Evaluate · 12 Charts</text>
  <text x="960" y="778" font-size="11" fill="#6B6B6B" text-anchor="middle" class="mono">model_evaluator.compute()</text>

  <rect x="1180" y="750" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="766" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">EvalReport</text>

  <line x1="960" y1="796" x2="960" y2="820" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Save Model -->
  <rect x="770" y="824" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#E8500A" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="852" font-size="16" font-weight="800" fill="#0A0A0A" text-anchor="middle">Save Model + Render Card</text>
  <text x="960" y="874" font-size="11" fill="#6B6B6B" text-anchor="middle"><tspan class="mono">.joblib</tspan> on disk · <tspan class="mono">TrainResultCard.tsx</tspan></text>

  <rect x="1180" y="846" width="170" height="24" rx="12" fill="#FFF3EE" stroke="#FCE0D2"/>
  <text x="1265" y="862" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">model_id</text>

  <line x1="960" y1="892" x2="960" y2="916" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <circle cx="960" cy="942" r="26" fill="#E8500A" filter="url(#shadow)"/>
  <text x="960" y="948" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">END</text>

  <!-- LEFT lane labels -->
  <g transform="translate(60, 200)">
    <rect x="0" y="12" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="34" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 1</text>
    <text x="20" y="58" font-size="14" font-weight="800" fill="#0A0A0A">HTTP · API</text>
    <text x="20" y="74" font-size="10" fill="#6B6B6B">Next.js → FastAPI</text>

    <rect x="0" y="108" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="130" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 2</text>
    <text x="20" y="154" font-size="14" font-weight="800" fill="#0A0A0A">AI · LLM</text>
    <text x="20" y="170" font-size="10" fill="#6B6B6B">heuristic + suggest</text>

    <rect x="0" y="204" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="226" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 3</text>
    <text x="20" y="250" font-size="14" font-weight="800" fill="#0A0A0A">USER · MODAL</text>
    <text x="20" y="266" font-size="10" fill="#6B6B6B">config panel</text>

    <rect x="0" y="300" width="220" height="200" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="322" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 4</text>
    <text x="20" y="346" font-size="14" font-weight="800" fill="#0A0A0A">BACKEND</text>
    <text x="20" y="362" font-size="10" fill="#6B6B6B">train loop · 5 steps</text>
    <text x="20" y="390" font-size="10" fill="#9B9B9B" class="mono">CV + Optuna</text>
    <text x="20" y="408" font-size="10" fill="#9B9B9B" class="mono">27 algorithms</text>

    <rect x="0" y="528" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="550" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 5</text>
    <text x="20" y="574" font-size="14" font-weight="800" fill="#0A0A0A">BACKEND</text>
    <text x="20" y="590" font-size="10" fill="#6B6B6B">evaluator + 12 charts</text>

    <rect x="0" y="624" width="220" height="68" rx="12" fill="#FAFAFA" stroke="#E5E4E1" stroke-dasharray="4 3"/>
    <text x="20" y="646" font-size="10" font-weight="800" fill="#E8500A" letter-spacing="1.5">LANE 6</text>
    <text x="20" y="670" font-size="14" font-weight="800" fill="#0A0A0A">STORAGE</text>
    <text x="20" y="686" font-size="10" fill="#6B6B6B">.joblib · metadata.json</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(60, 1015)">
    <circle cx="14" cy="0" r="10" fill="#E8500A"/>
    <text x="34" y="4" font-size="11" fill="#3A3A3A">Start / End event</text>

    <rect x="170" y="-10" width="22" height="20" rx="5" fill="#FFFFFF" stroke="#E8500A" stroke-width="1.5"/>
    <text x="200" y="4" font-size="11" fill="#3A3A3A">Process step</text>

    <rect x="320" y="-10" width="22" height="20" rx="5" fill="#FFF3EE" stroke="#E8500A" stroke-width="1.5"/>
    <text x="350" y="4" font-size="11" fill="#3A3A3A">User-interactive step</text>

    <rect x="500" y="-12" width="32" height="24" rx="6" fill="#FFFFFF" stroke="#E8500A" stroke-width="2.5"/>
    <text x="540" y="4" font-size="11" fill="#3A3A3A">Sub-process (expanded)</text>

    <line x1="710" y1="0" x2="738" y2="0" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="748" y="4" font-size="11" fill="#3A3A3A">Sequence flow</text>

    <rect x="880" y="-10" width="22" height="20" rx="10" fill="#FFF3EE" stroke="#FCE0D2"/>
    <text x="910" y="4" font-size="11" fill="#3A3A3A">Data object / payload</text>

    <text x="1800" y="4" font-size="11" fill="#9B9B9B" text-anchor="end" class="mono">PrepPilot · 2026-05-19</text>
  </g>

</svg>