<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrepPilot — System Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --o:      #E8500A;
      --o2:     #FF6B2B;
      --o-soft: #FFF3EE;
      --o-line: #FCE0D2;
      --ink:    #0A0A0A;
      --ink3:   #6B6B6B;
      --line:   #E5E4E1;
    }
    html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--ink); }
    .frame { width: 1920px; margin: 0 auto; padding: 0; background: #FFFFFF; }
    @media print { @page { size: 1920px 1080px landscape; margin: 0; } body { background: #fff; } }
    svg { display: block; width: 100%; height: auto; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
<div class="frame">

<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PrepPilot system flow">

  <defs>
    <!-- ── Minimal line icons (orange) ── -->
    <symbol id="iUser" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="currentColor"/>
      <path d="M4 22 C4 16 7.6 14 12 14 C16.4 14 20 16 20 22 Z" fill="currentColor"/>
    </symbol>
    <symbol id="iCloud" viewBox="0 0 24 24">
      <path d="M7 18 C4.2 18 2 15.8 2 13 C2 10.4 4 8.2 6.6 8 C7.5 5.6 9.8 4 12.5 4 C15.8 4 18.5 6.5 18.9 9.7 C20.7 10.1 22 11.7 22 13.7 C22 16 20.1 18 17.7 18 Z" fill="currentColor"/>
    </symbol>
    <symbol id="iServer" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="7" rx="1.2" fill="currentColor"/>
      <rect x="3" y="13" width="18" height="7" rx="1.2" fill="currentColor"/>
      <circle cx="7" cy="7.5" r="1.2" fill="#FFFFFF"/>
      <circle cx="7" cy="16.5" r="1.2" fill="#FFFFFF"/>
    </symbol>
    <symbol id="iDb" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="2.6" fill="currentColor"/>
      <path d="M4 5 V19 C4 20.4 7.6 21.6 12 21.6 C16.4 21.6 20 20.4 20 19 V5 Z" fill="currentColor" opacity="0.85"/>
      <ellipse cx="12" cy="12" rx="8" ry="2.2" fill="#FFFFFF" opacity="0.25"/>
    </symbol>
    <symbol id="iLock" viewBox="0 0 24 24">
      <rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/>
      <path d="M8 11 V8 C8 5.8 9.8 4 12 4 C14.2 4 16 5.8 16 8 V11" stroke="currentColor" stroke-width="2" fill="none"/>
    </symbol>
    <symbol id="iSpark" viewBox="0 0 24 24">
      <path d="M12 2 L13.5 9 L21 10.5 L13.5 12 L12 19 L10.5 12 L3 10.5 L10.5 9 Z" fill="currentColor"/>
    </symbol>
    <symbol id="iChart" viewBox="0 0 24 24">
      <rect x="3.5" y="14" width="4" height="6.5" rx="0.6" fill="currentColor"/>
      <rect x="10" y="9" width="4" height="11.5" rx="0.6" fill="currentColor"/>
      <rect x="16.5" y="3.5" width="4" height="17" rx="0.6" fill="currentColor"/>
    </symbol>
    <symbol id="iCode" viewBox="0 0 24 24">
      <path d="M8 6 L2 12 L8 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 6 L22 12 L16 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="iCog" viewBox="0 0 24 24">
      <path d="M12 8 a4 4 0 1 0 0 8 a4 4 0 1 0 0 -8 z M19 12 l2.6 -1.5 l-1 -2.6 l-3 0.7 l-1.5 -1.5 l0.7 -3 l-2.6 -1 l-1.5 2.6 l-2 0 l-1.5 -2.6 l-2.6 1 l0.7 3 l-1.5 1.5 l-3 -0.7 l-1 2.6 l2.6 1.5 l0 2 l-2.6 1.5 l1 2.6 l3 -0.7 l1.5 1.5 l-0.7 3 l2.6 1 l1.5 -2.6 l2 0 l1.5 2.6 l2.6 -1 l-0.7 -3 l1.5 -1.5 l3 0.7 l1 -2.6 l-2.6 -1.5 z" fill="currentColor" fill-rule="evenodd"/>
    </symbol>
    <symbol id="iEye" viewBox="0 0 24 24">
      <path d="M2 12 C5 6 8.5 4 12 4 C15.5 4 19 6 22 12 C19 18 15.5 20 12 20 C8.5 20 5 18 2 12 Z" fill="currentColor"/>
      <circle cx="12" cy="12" r="3.5" fill="#FFFFFF"/>
    </symbol>

    <filter id="shadow" x="-2%" y="-2%" width="104%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L11,5 z" fill="#E8500A"/>
    </marker>
    <marker id="arrowDim" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L11,5 z" fill="#E8500A" opacity="0.55"/>
    </marker>
    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8500A"/>
      <stop offset="100%" stop-color="#FF6B2B"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ── Title bar ── -->
  <rect x="0" y="0" width="6" height="120" fill="url(#titleAccent)"/>
  <text x="60" y="62" font-size="38" font-weight="800" fill="#0A0A0A" letter-spacing="-0.5">PrepPilot — System Flow</text>
  <text x="60" y="94" font-size="15" font-weight="500" fill="#6B6B6B">How a user request moves through the stack</text>
  <text x="1860" y="84" font-size="12" fill="#9B9B9B" text-anchor="end">2026-05-19 · Sprint 5.7</text>

  <line x1="40" y1="130" x2="1880" y2="130" stroke="#E5E4E1" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       USER                                                                          -->
  <g transform="translate(80, 320)" color="#E8500A">
    <circle cx="60" cy="60" r="58" fill="#FFF3EE" stroke="#E8500A" stroke-width="2.5"/>
    <use href="#iUser" x="22" y="22" width="76" height="76"/>
    <text x="60" y="158" font-size="17" font-weight="800" fill="#0A0A0A" text-anchor="middle">User</text>
    <text x="60" y="180" font-size="12" fill="#6B6B6B" text-anchor="middle">browser session</text>
  </g>

  <!-- arrow user → frontend -->
  <line x1="216" y1="380" x2="294" y2="380" stroke="#E8500A" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="255" y="368" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">HTTPS</text>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       FRONTEND ZONE                                                                  -->
  <g transform="translate(320, 200)" color="#E8500A">
    <rect width="500" height="500" rx="18" fill="#FFFDFB" stroke="#E8500A" stroke-width="2.5" stroke-dasharray="10 6"/>

    <!-- Zone header -->
    <use href="#iCloud" x="28" y="28" width="34" height="34"/>
    <text x="74" y="46" font-size="20" font-weight="800" fill="#E8500A">Frontend</text>
    <text x="74" y="68" font-size="12" font-weight="500" fill="#6B6B6B">Vercel · Next.js 16</text>

    <!-- ── Auth & Session ── -->
    <g transform="translate(40, 110)">
      <rect width="420" height="100" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iLock" x="24" y="30" width="40" height="40"/>
      <text x="88" y="44" font-size="17" font-weight="700" fill="#0A0A0A">Auth &amp; Session</text>
      <text x="88" y="68" font-size="12" fill="#6B6B6B">Google OAuth · NextAuth v5</text>
      <text x="88" y="86" font-size="12" fill="#6B6B6B">database-backed sessions</text>
    </g>

    <!-- ── Chat UI ── -->
    <g transform="translate(40, 230)">
      <rect width="420" height="120" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iChart" x="24" y="40" width="40" height="40"/>
      <text x="88" y="44" font-size="17" font-weight="700" fill="#0A0A0A">Chat UI</text>
      <text x="88" y="68" font-size="12" fill="#6B6B6B">messages · datasets · slash commands</text>
      <text x="88" y="86" font-size="12" fill="#6B6B6B">Plotly charts · interactive tables</text>
      <text x="88" y="104" font-size="12" fill="#6B6B6B">multi-format upload &amp; export</text>
    </g>

    <!-- ── API Proxy ── -->
    <g transform="translate(40, 370)">
      <rect width="420" height="100" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iCode" x="24" y="30" width="40" height="40"/>
      <text x="88" y="44" font-size="17" font-weight="700" fill="#0A0A0A">API Proxy</text>
      <text x="88" y="68" font-size="12" fill="#6B6B6B">thin /api/* route handlers</text>
      <text x="88" y="86" font-size="12" fill="#6B6B6B">forward to backend · no ML logic</text>
    </g>
  </g>

  <!-- arrow frontend → backend -->
  <line x1="836" y1="450" x2="914" y2="450" stroke="#E8500A" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="875" y="438" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">JSON</text>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       BACKEND ZONE                                                                   -->
  <g transform="translate(940, 200)" color="#E8500A">
    <rect width="540" height="500" rx="18" fill="#FFFDFB" stroke="#E8500A" stroke-width="2.5" stroke-dasharray="10 6"/>

    <use href="#iServer" x="28" y="28" width="34" height="34"/>
    <text x="74" y="46" font-size="20" font-weight="800" fill="#E8500A">Backend</text>
    <text x="74" y="68" font-size="12" font-weight="500" fill="#6B6B6B">FastAPI · Render Singapore</text>

    <!-- ── AI Pipeline (with inline 4-step mini flow) ── -->
    <g transform="translate(40, 110)">
      <rect width="460" height="140" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iSpark" x="24" y="22" width="40" height="40"/>
      <text x="88" y="36" font-size="17" font-weight="700" fill="#0A0A0A">AI Agent Pipeline</text>
      <text x="88" y="58" font-size="12" fill="#6B6B6B">two-stage routing · auto retry · LLM narrator</text>

      <!-- 4 pills inline -->
      <g transform="translate(20, 86)">
        <rect x="0" y="0" width="96" height="34" rx="8" fill="#FFF3EE" stroke="#FCE0D2"/>
        <text x="48" y="22" font-size="12" font-weight="700" fill="#E8500A" text-anchor="middle">Router</text>

        <line x1="98" y1="17" x2="112" y2="17" stroke="#E8500A" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="116" y="0" width="96" height="34" rx="8" fill="#FFF3EE" stroke="#FCE0D2"/>
        <text x="164" y="22" font-size="12" font-weight="700" fill="#E8500A" text-anchor="middle">Planner</text>

        <line x1="214" y1="17" x2="228" y2="17" stroke="#E8500A" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="232" y="0" width="96" height="34" rx="8" fill="#FFF3EE" stroke="#FCE0D2"/>
        <text x="280" y="22" font-size="12" font-weight="700" fill="#E8500A" text-anchor="middle">Executor</text>

        <line x1="330" y1="17" x2="344" y2="17" stroke="#E8500A" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="348" y="0" width="96" height="34" rx="8" fill="#FFF3EE" stroke="#FCE0D2"/>
        <text x="396" y="22" font-size="12" font-weight="700" fill="#E8500A" text-anchor="middle">Interpreter</text>
      </g>
    </g>

    <!-- ── Handlers ── -->
    <g transform="translate(40, 270)">
      <rect width="460" height="90" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iCog" x="22" y="22" width="44" height="44"/>
      <text x="88" y="40" font-size="17" font-weight="700" fill="#0A0A0A">Handler Library · 417 ops</text>
      <text x="88" y="62" font-size="12" fill="#6B6B6B">stats · clean · transform · viz</text>
      <text x="88" y="78" font-size="12" fill="#6B6B6B">feature · nlp · analysis</text>
    </g>

    <!-- ── Sandbox ── -->
    <g transform="translate(40, 380)">
      <rect width="460" height="90" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iCode" x="24" y="26" width="40" height="40"/>
      <text x="88" y="40" font-size="17" font-weight="700" fill="#0A0A0A">Sandbox</text>
      <text x="88" y="62" font-size="12" fill="#6B6B6B">isolated Python exec()</text>
      <text x="88" y="78" font-size="12" fill="#6B6B6B" class="mono">/train · /predict · /feature · /eda</text>
    </g>
  </g>

  <!-- arrow backend → external -->
  <line x1="1496" y1="450" x2="1574" y2="450" stroke="#E8500A" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1535" y="438" font-size="11" font-weight="700" fill="#E8500A" text-anchor="middle" class="mono">API · TLS</text>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       EXTERNAL ZONE                                                                  -->
  <g transform="translate(1600, 200)" color="#E8500A">
    <rect width="280" height="500" rx="18" fill="#FFFDFB" stroke="#E8500A" stroke-width="2.5" stroke-dasharray="10 6"/>

    <use href="#iCloud" x="28" y="28" width="34" height="34"/>
    <text x="74" y="46" font-size="20" font-weight="800" fill="#E8500A">External</text>
    <text x="74" y="68" font-size="12" font-weight="500" fill="#6B6B6B">LLM &amp; storage</text>

    <!-- ── LLM Providers ── -->
    <g transform="translate(24, 110)">
      <rect width="232" height="170" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iSpark" x="20" y="22" width="34" height="34"/>
      <text x="64" y="44" font-size="15" font-weight="700" fill="#0A0A0A">LLM Providers</text>
      <g transform="translate(20, 74)">
        <rect width="192" height="38" rx="8" fill="#FFF3EE"/>
        <text x="96" y="18" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Anthropic Claude</text>
        <text x="96" y="32" font-size="10" fill="#6B6B6B" text-anchor="middle">Haiku · Sonnet · Opus</text>
      </g>
      <g transform="translate(20, 120)">
        <rect width="192" height="38" rx="8" fill="#FFF3EE"/>
        <text x="96" y="18" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">OpenAI GPT</text>
        <text x="96" y="32" font-size="10" fill="#6B6B6B" text-anchor="middle">GPT-5 family</text>
      </g>
    </g>

    <!-- ── Data Stores ── -->
    <g transform="translate(24, 300)">
      <rect width="232" height="170" rx="12" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5" filter="url(#shadow)"/>
      <use href="#iDb" x="20" y="22" width="34" height="34"/>
      <text x="64" y="44" font-size="15" font-weight="700" fill="#0A0A0A">Data Stores</text>
      <g transform="translate(20, 74)">
        <rect width="192" height="38" rx="8" fill="#FFF3EE"/>
        <text x="96" y="18" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">MongoDB Atlas</text>
        <text x="96" y="32" font-size="10" fill="#6B6B6B" text-anchor="middle">users · datasets · models</text>
      </g>
      <g transform="translate(20, 120)">
        <rect width="192" height="38" rx="8" fill="#FFF3EE"/>
        <text x="96" y="18" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="middle">Persistent Disk</text>
        <text x="96" y="32" font-size="10" fill="#6B6B6B" text-anchor="middle">.joblib · pipelines</text>
      </g>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       Small reverse-flow hints next to each forward arrow                            -->
  <g opacity="0.55">
    <!-- User ← Frontend (response) -->
    <line x1="294" y1="408" x2="216" y2="408" stroke="#E8500A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDim)"/>
    <text x="255" y="424" font-size="10" font-weight="600" fill="#E8500A" text-anchor="middle">response</text>

    <!-- Frontend ← Backend -->
    <line x1="914" y1="478" x2="836" y2="478" stroke="#E8500A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDim)"/>
    <text x="875" y="494" font-size="10" font-weight="600" fill="#E8500A" text-anchor="middle">result</text>

    <!-- Backend ← External -->
    <line x1="1574" y1="478" x2="1496" y2="478" stroke="#E8500A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDim)"/>
    <text x="1535" y="494" font-size="10" font-weight="600" fill="#E8500A" text-anchor="middle">data</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════════
       OBSERVABILITY (bottom strip)                                                   -->
  <g transform="translate(80, 830)" color="#E8500A">
    <rect width="1760" height="180" rx="16" fill="#FAFAFA" stroke="#E5E4E1" stroke-width="1.5"/>

    <use href="#iEye" x="28" y="26" width="30" height="30"/>
    <text x="70" y="48" font-size="18" font-weight="800" fill="#0A0A0A">Observability</text>
    <text x="70" y="68" font-size="12" fill="#6B6B6B">cross-stack monitoring</text>

    <!-- 4 monitoring cards -->
    <g transform="translate(380, 36)">
      <rect width="320" height="108" rx="12" fill="#FFFFFF" stroke="#E5E4E1"/>
      <text x="160" y="44" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="middle">Vercel Analytics</text>
      <text x="160" y="68" font-size="12" fill="#6B6B6B" text-anchor="middle">edge logs · Web Vitals</text>
      <text x="160" y="86" font-size="12" fill="#6B6B6B" text-anchor="middle">function invocations</text>
    </g>
    <g transform="translate(720, 36)">
      <rect width="320" height="108" rx="12" fill="#FFFFFF" stroke="#E5E4E1"/>
      <text x="160" y="44" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="middle">Render Logs</text>
      <text x="160" y="68" font-size="12" fill="#6B6B6B" text-anchor="middle">stdout · stderr</text>
      <text x="160" y="86" font-size="12" fill="#6B6B6B" text-anchor="middle">structured logger</text>
    </g>
    <g transform="translate(1060, 36)">
      <rect width="320" height="108" rx="12" fill="#FFFFFF" stroke="#E5E4E1"/>
      <text x="160" y="44" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="middle">Health Checks</text>
      <text x="160" y="68" font-size="12" fill="#6B6B6B" text-anchor="middle">/health every 30s</text>
      <text x="160" y="86" font-size="12" fill="#6B6B6B" text-anchor="middle">auto-restart on fail</text>
    </g>
    <g transform="translate(1400, 36)">
      <rect width="320" height="108" rx="12" fill="#FFFFFF" stroke="#E5E4E1"/>
      <text x="160" y="44" font-size="15" font-weight="700" fill="#0A0A0A" text-anchor="middle">Error Recovery</text>
      <text x="160" y="68" font-size="12" fill="#6B6B6B" text-anchor="middle">codegen auto-retry</text>
      <text x="160" y="86" font-size="12" fill="#6B6B6B" text-anchor="middle">graceful 529 overload</text>
    </g>
  </g>

  <!-- Footer / legend -->
  <g transform="translate(80, 1045)">
    <rect x="0" y="-8" width="20" height="14" rx="3" fill="#FFFDFB" stroke="#E8500A" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="28" y="4" font-size="11" fill="#3A3A3A">Network zone</text>

    <line x1="160" y1="-2" x2="184" y2="-2" stroke="#E8500A" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="194" y="4" font-size="11" fill="#3A3A3A">Request flow</text>

    <line x1="296" y1="-2" x2="320" y2="-2" stroke="#E8500A" stroke-width="2" stroke-dasharray="5 4" opacity="0.55"/>
    <text x="330" y="4" font-size="11" fill="#3A3A3A">Response path</text>

    <text x="1700" y="4" font-size="11" fill="#9B9B9B" text-anchor="end" class="mono">PrepPilot · 2026-05-19</text>
  </g>

</svg>

</div>
</body>
</html>
